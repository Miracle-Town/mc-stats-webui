name: build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup dotnet for Minecraft item rendering
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: enable corepack
        run: corepack enable

      - name: cache yarn
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: cache pinned Minecraft build tooling
        uses: actions/cache@v4
        with:
          path: build/tools/mc-atlas
          key: mc-tooling-${{ runner.os }}-${{ hashFiles('scripts/prepare_mc_tooling.py', 'scripts/mc-atlas/toolchain.json', 'scripts/mc-atlas/tooling.patch') }}

      - name: cache version-specific Minecraft resources
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.minecraft }}/mc/generated
          key: mc-resources-${{ runner.os }}-${{ matrix.minecraft }}-${{ hashFiles('scripts/generate_mc_resources.py', 'scripts/mc_metadata.py', 'scripts/prepare_mc_tooling.py', 'scripts/mc-atlas/*') }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }}

      - name: check web UI
        working-directory: web
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: corepack yarn check

      - name: upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mc-stats-webui-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/mc-stats-webui-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: select release artifacts
        id: artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *+26.1.2) pattern=mc-stats-webui-26.1.2 ;;
            *+26.2) pattern=mc-stats-webui-26.2 ;;
            *+26.3) pattern=mc-stats-webui-26.3 ;;
            *+*) echo "Unsupported version in release tag: $RELEASE_TAG" >&2; exit 1 ;;
            *) pattern='mc-stats-webui-*' ;;
          esac
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"

      - name: download JARs
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ steps.artifacts.outputs.pattern }}
          path: release
          merge-multiple: true

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: release/mc-stats-webui-*.jar
          generate_release_notes: true
