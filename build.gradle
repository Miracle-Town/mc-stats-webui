plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.group

def supportedVersions = [
	'26.1.2': [api: '0.155.3+26.1.2', compat: 'legacy'],
	'26.2': [api: '0.161.0+26.2', compat: 'legacy'],
	'26.3': [api: '0.161.0+26.3', compat: 'modern']
]
def target = supportedVersions[project.minecraft_version as String]
if (target == null) {
	throw new GradleException("Unsupported Minecraft version: ${project.minecraft_version}. Choose ${supportedVersions.keySet().join(', ')}")
}
def fabricApiVersion = providers.gradleProperty('fabric_api_version').getOrElse(target.api)

// Keep classes and JARs from different Minecraft versions separate.
layout.buildDirectory = file("build/${project.minecraft_version}")
sourceSets.main.java.srcDir("src/compat/${target.compat}/java")

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()
	runs.configureEach {
		runDir "run/${project.minecraft_version}"
	}

	mods {
		"mc-stats-webui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('yarnInstall', Exec) {
	workingDir file('web')
	if (isWindows) {
		commandLine 'cmd', '/c', 'corepack', 'yarn', 'install'
	} else {
		commandLine 'corepack', 'yarn', 'install'
	}
	inputs.files file('web/package.json'), file('web/yarn.lock')
	outputs.dir file('web/node_modules')
}

def mcVersion = project.minecraft_version as String
def mcTooling = layout.projectDirectory.dir('build/tools/mc-atlas')
def mcResources = layout.buildDirectory.dir('mc/generated')
def webOutput = layout.buildDirectory.dir('web')
def pythonCommand = isWindows ? 'python' : 'python3'

tasks.register('prepareMcTooling', Exec) {
	environment 'PYTHONDONTWRITEBYTECODE', '1'
	inputs.file file('scripts/prepare_mc_tooling.py')
	inputs.files file('scripts/mc-atlas/toolchain.json'), file('scripts/mc-atlas/tooling.patch')
	outputs.file mcTooling.file('classpath.txt')
	outputs.file mcTooling.file('toolchain.json')
	outputs.dir mcTooling.dir('generator/tooling/target/classes')
	outputs.file mcTooling.file('renderer/MinecraftRenderer/MinecraftRenderer.csproj')
	commandLine pythonCommand, 'scripts/prepare_mc_tooling.py', '--output', mcTooling.asFile.absolutePath
}

tasks.register('generateMcResources', Exec) {
	environment 'PYTHONDONTWRITEBYTECODE', '1'
	dependsOn prepareMcTooling
	inputs.property 'minecraft_version', mcVersion
	def cachedClientJar = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${mcVersion}/minecraft-client.jar")
	inputs.files providers.provider { cachedClientJar.isFile() ? [cachedClientJar] : [] }
	inputs.files file('scripts/generate_mc_resources.py'), file('scripts/mc_metadata.py')
	inputs.file file('scripts/prepare_mc_tooling.py')
	inputs.files file('scripts/mc-atlas/toolchain.json'), file('scripts/mc-atlas/aliases.json'), file('scripts/mc-atlas/tooling.patch')
	inputs.file file('scripts/mc-atlas/texture-aliases.json')
	outputs.dir mcResources
	localState.register(layout.buildDirectory.dir('mc/work'))
	environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
	commandLine pythonCommand, 'scripts/generate_mc_resources.py', '--version', mcVersion,
		'--tooling', mcTooling.asFile.absolutePath,
		'--output', mcResources.get().asFile.absolutePath,
		'--work', layout.buildDirectory.dir('mc/work').get().asFile.absolutePath
	def forceResources = providers.gradleProperty('force_mc_resources').getOrElse('false').toBoolean()
	outputs.upToDateWhen { !forceResources }
	if (forceResources) args '--force'
}

tasks.register('testMcResources', Exec) {
	environment 'PYTHONDONTWRITEBYTECODE', '1'
	commandLine pythonCommand, '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_mc_resources.py'
}

tasks.named('check') {
	dependsOn testMcResources
}

tasks.register('yarnBuild', Exec) {
	dependsOn yarnInstall, generateMcResources
	workingDir file('web')
	if (isWindows) {
		commandLine 'cmd', '/c', 'corepack', 'yarn', 'build'
	} else {
		commandLine 'corepack', 'yarn', 'build'
	}
	inputs.dir file('web/src')
	inputs.files fileTree('web/static') { exclude 'mc/**' }
	inputs.dir mcResources
	inputs.property 'minecraft_version', mcVersion
	inputs.files file('web/package.json'), file('web/yarn.lock'), file('web/vite.config.ts'), file('web/tsconfig.base.json'), file('web/build-paths.js'), file('web/scripts/run.mjs'), file('web/src/app.html')
	environment 'MC_VERSION', mcVersion
	environment 'MC_RESOURCES_DIR', mcResources.get().asFile.absolutePath
	environment 'WEB_BUILD_DIR', webOutput.get().asFile.absolutePath
	outputs.dir webOutput
	localState.register(layout.buildDirectory.dir('svelte-kit'))
}

processResources {
	dependsOn yarnBuild
	// ProcessResources copies new files but does not remove obsolete hashed assets.
	// Clear only the generated frontend subtree so old PNGs never remain in the JAR.
	doFirst {
		delete layout.buildDirectory.dir('resources/main/assets/mc-stats-webui/web')
	}
	def version = project.version
	def minecraftVersion = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion
	}

	from(webOutput) {
		into 'assets/mc-stats-webui/web'
	}

	from('web/src/lib/assets/fonts') {
		include 'Unifont-OFL-1.1.txt'
		into 'assets/mc-stats-webui/web/fonts'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
